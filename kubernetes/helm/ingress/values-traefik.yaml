providers:
  kubernetesGateway:
    # Required to use Gateway API resources (GatewayClass, Gateway, HTTPRoute)
    # instead of deprecated IngressRoute CRDs
    enabled: true
  kubernetesIngress:
    enabled: false

ports:
  web:
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true

service:
  type: LoadBalancer

logs:
  general:
    level: INFO
  access:
    enabled: true
