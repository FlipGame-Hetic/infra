apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: game-system
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/managed-by: kustomize
spec:
  parentRefs:
    - name: flipper-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080
