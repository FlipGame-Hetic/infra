apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flipper-gateway
  namespace: game-system
  labels:
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/managed-by: kustomize
spec:
  gatewayClassName: traefik
  listeners:
    # Traefik's "web" entryPoint listens on :8000 internally (K3s default).
    # The Service maps 80→8000 externally, but the Gateway listener must match
    # the actual entryPoint port so Traefik can bind the routes.
    - name: web
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
