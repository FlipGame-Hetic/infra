apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dmd-screen-route
  namespace: game-system
  labels:
    app.kubernetes.io/name: dmd-screen
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/managed-by: kustomize
spec:
  parentRefs:
    - name: flipper-gateway
  hostnames:
    - "dmd.flipper.example.com"
  rules:
    - backendRefs:
        - name: dmd-screen
          port: 80
