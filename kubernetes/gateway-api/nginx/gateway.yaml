apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flipper-gateway
  namespace: game-system
  labels:
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/managed-by: kustomize
spec:
  # nginx-gateway-fabric installs its own GatewayClass named "nginx"
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
