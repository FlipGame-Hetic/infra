apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: game-system
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/managed-by: kustomize
spec:
  parentRefs:
    - name: flipper-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
