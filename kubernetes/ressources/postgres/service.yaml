apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: game-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP: postgres must not be reachable outside the cluster
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
