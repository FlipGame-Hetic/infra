apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: game-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
spec:
  # local-path is the default K3s storage provisioner (no cloud CSI needed)
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
