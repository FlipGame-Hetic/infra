apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmd-screen
  namespace: game-system
  labels:
    app.kubernetes.io/name: dmd-screen
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/component: screen
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dmd-screen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dmd-screen
        app.kubernetes.io/part-of: flipper
        app.kubernetes.io/component: screen
    spec:
      containers:
        - name: dmd-screen
          image: dmd-screen:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
