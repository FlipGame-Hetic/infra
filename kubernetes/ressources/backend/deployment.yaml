apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: game-system
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: flipper
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: flipper
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: backend:latest
          # IfNotPresent avoids redundant pulls on each restart when using a fixed tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SCREEN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SCREEN_JWT_SECRET
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: backend-sqlite-pvc
