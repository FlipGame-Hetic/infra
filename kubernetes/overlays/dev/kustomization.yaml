apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../ressources
  - ../../gateway-api
  - ../../gateway-api/nginx

images:
  - name: backend
    newName: ghcr.io/flipgame-hetic/backend
    newTag: dev
  - name: frontend
    newName: ghcr.io/flipgame-hetic/frontend
    newTag: dev

patches:
  - path: patches/backend.yaml
  - path: patches/frontend.yaml
  - path: patches/frontend-config.yaml
